services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: brainmail
      POSTGRES_USER: brainmail
      POSTGRES_PASSWORD: local-development-only
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U brainmail']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
